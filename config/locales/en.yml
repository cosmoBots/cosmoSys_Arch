en:
  text_cosmosys_arch_report_capture_timeout: The figure could not be prepared in time. Open the piece viewer to try again.
  text_cosmosys_arch_report_capture_unsaved: The figure is only available on this page. A user with edit and view-saving permissions must generate the capture to include it in exported reports.
  label_cosmosys_arch_reset_import: Reset CAD import
  text_cosmosys_arch_reset_explanation: Only this item's previous import configuration will be cleared. The item, CSID, history, attachments and saved views are preserved. You can then select the GLB and YAML again. Children and other items are never deleted automatically.
  text_cosmosys_arch_reset_confirm: I confirm that I want to discard the previous import configuration.
  text_cosmosys_arch_reset_not_source: This item is not the source of a CAD import that can be reset.
  text_cosmosys_arch_reset_has_items: Children or items linked to this model still exist. Resolve them before resetting the import, even if they have moved outside this subtree.
  text_cosmosys_arch_reset_changed: The configuration changed. Open the confirmation page again before resetting it.
  text_cosmosys_arch_reset_done: CAD import reset. The previous configuration was discarded; the item and its attachments were preserved.
  label_cosmosys_arch_bulk_filter: Bulk selection
  label_cosmosys_arch_filter_query: Name or expression
  label_cosmosys_arch_filter_regex: Regular expression (case-insensitive)
  label_cosmosys_arch_filter_field: Match against
  label_cosmosys_arch_filter_path: CAD path
  label_cosmosys_arch_filter_hide: Hide geometry
  label_cosmosys_arch_filter_show: Show geometry
  label_cosmosys_arch_filter_preview: Preview matches
  text_cosmosys_arch_filter_matches: '%{matches} matching nodes; %{affected} nodes in their subtrees. No decisions changed yet.'
  text_cosmosys_arch_filter_applied: Decisions updated. Repeat review before importing.
  text_cosmosys_arch_filter_error: Could not evaluate the filter. No decisions changed.
  text_cosmosys_arch_filter_timeout: Filter timed out. Simplify the expression; no decisions changed.
  label_cosmosys_arch_piece_view: Piece view
  label_cosmosys_arch_restore_camera: Restore view
  label_cosmosys_arch_save_camera: Save named view
  label_cosmosys_arch_save_default_camera: Save as default
  text_cosmosys_arch_camera_defaults: The capture saves camera and appearance at default degree-of-freedom values; it does not save the temporary pose.
  label_cosmosys_arch_project_profile: Product architecture (PBS)
  text_cosmosys_arch_project_profile: Product Breakdown Structure project. Architecture nodes can contain other architecture nodes without a fixed depth limit.
  label_cosmosys_arch_item_profile_node: Architecture node
  label_cosmosys_arch_item_profile_node_fields: Architecture node fields
  text_cosmosys_arch_item_profile_node: A node in the product architecture hierarchy.
  field_arch_type: Architecture type
  label_cosmosys_arch_type_complex: Complex
  label_cosmosys_arch_type_optical: Optical
  label_cosmosys_arch_type_mechanical: Mechanical
  label_cosmosys_arch_type_hardware: Hardware
  label_cosmosys_arch_type_software: Software
  label_cosmosys_arch_dof: Degree of freedom
  text_cosmosys_arch_dof: A rigid translation or rotation controlling an architecture node.
  label_cosmosys_arch_cad_import: Import architecture from GLB and YAML
  label_cosmosys_arch_cad_model: CAD model and controls
  text_cosmosys_arch_cad_import: Attach a GLB model and its YAML to this item, then review the hierarchy. No items are created before confirmation.
  label_cosmosys_arch_review: Review import
  label_cosmosys_arch_review_again: Repeat review
  label_cosmosys_arch_confirm: Confirm import
  label_cosmosys_arch_nodes: Nodes
  label_cosmosys_arch_dofs: Degrees of freedom
  label_cosmosys_arch_import_mode: Import policy
  label_cosmosys_arch_visible: Visible in model
  label_cosmosys_arch_mode_include: Include
  label_cosmosys_arch_mode_atomic: Atomic assembly
  label_cosmosys_arch_mode_exclude: Exclude subtree
  text_cosmosys_arch_preflight: Excluding removes the subtree from the architecture. Atomic assemblies retain geometry but not internal items. Expand atomic assemblies containing required controls. Invisible items remain available in reports. Repeat review after changing decisions.
  text_cosmosys_arch_pose_temporary: Sliders change only this viewer. They do not change the CAD source or saved defaults. Composition is rest, local XYZ, then global XYZ, parents first. PORIS and MQTT are not connected yet.
  label_cosmosys_arch_controls_ready: Model controls ready
  label_cosmosys_arch_reset_pose: Return to defaults
  label_cosmosys_arch_expand_all: Expand all
  label_cosmosys_arch_collapse_all: Collapse all
  label_cosmosys_arch_show_model: Show complete model
  label_cosmosys_arch_show_context: Highlight selection in context
  text_cosmosys_arch_tree_inspect: Click a name to inspect its subtree; use the arrow to expand children. Inspection includes excluded or invisible geometry and does not represent the final filter. Folding never changes decisions.
  text_cosmosys_arch_repeat_review: Decisions have changed. Repeat review before confirming the import.
  field_arch_motion: Motion
  field_arch_axis: Axis
  field_arch_space: Coordinate space
  field_arch_min: Minimum
  field_arch_max: Maximum
  field_arch_default: Default
  field_arch_step: Step
