es:
  text_cosmosys_arch_report_capture_timeout: No se pudo preparar la figura a tiempo. Abre el visor de la pieza para volver a intentarlo.
  text_cosmosys_arch_report_capture_unsaved: La figura sólo está disponible en esta página. Un usuario con permisos de edición y guardado debe generar la captura para incluirla en las exportaciones.
  label_cosmosys_arch_reset_import: Restablecer importación CAD
  text_cosmosys_arch_reset_explanation: Se eliminará únicamente la configuración de la importación anterior de este ítem. Se conservarán el ítem, su CSID, historial, adjuntos y vistas guardadas. Después podrás seleccionar de nuevo el GLB y, si es necesario, su YAML. No se borran hijos ni otros elementos automáticamente.
  text_cosmosys_arch_reset_confirm: Confirmo que quiero descartar la configuración de importación anterior.
  text_cosmosys_arch_reset_not_source: Este ítem no es el origen de una importación CAD que pueda restablecerse.
  text_cosmosys_arch_reset_has_items: Todavía hay hijos o elementos vinculados a este modelo. Debes resolverlos antes de restablecer la importación, aunque se hayan movido fuera de este subárbol.
  text_cosmosys_arch_reset_changed: La configuración ha cambiado. Abre de nuevo la confirmación antes de restablecerla.
  text_cosmosys_arch_reset_done: Importación CAD restablecida. Se ha descartado la configuración anterior, conservando el ítem y sus adjuntos.
  label_cosmosys_arch_bulk_filter: Selección masiva
  label_cosmosys_arch_filter_query: Nombre o expresión
  label_cosmosys_arch_filter_regex: Expresión regular (sin distinguir mayúsculas)
  label_cosmosys_arch_filter_field: Buscar en
  label_cosmosys_arch_filter_path: Ruta CAD
  label_cosmosys_arch_filter_hide: Ocultar geometría
  label_cosmosys_arch_filter_show: Mostrar geometría
  label_cosmosys_arch_filter_preview: Previsualizar coincidencias
  text_cosmosys_arch_filter_matches: '%{matches} nodos coincidentes; %{affected} nodos en sus subárboles. Aún no se han cambiado decisiones.'
  text_cosmosys_arch_filter_applied: Decisiones actualizadas. Repite la revisión antes de importar.
  text_cosmosys_arch_filter_error: No se pudo evaluar el filtro. No se han cambiado decisiones.
  text_cosmosys_arch_filter_timeout: El filtro agotó su tiempo. Simplifica la expresión; no se han cambiado decisiones.
  label_cosmosys_arch_piece_view: Vista de la pieza
  label_cosmosys_arch_restore_camera: Recuperar vista
  label_cosmosys_arch_save_camera: Guardar vista con nombre
  label_cosmosys_arch_save_default_camera: Guardar como predeterminada
  text_cosmosys_arch_camera_defaults: La captura guarda cámara y apariencia, con los grados de libertad en sus valores predeterminados; no guarda la pose temporal.
  label_cosmosys_arch_project_profile: Arquitectura de producto (PBS)
  text_cosmosys_arch_project_profile: Proyecto con una estructura de descomposición del producto. Los nodos de arquitectura pueden contener otros nodos sin límite fijo de profundidad.
  label_cosmosys_arch_item_profile_node: Nodo de arquitectura
  label_cosmosys_arch_item_profile_node_fields: Campos del nodo de arquitectura
  text_cosmosys_arch_item_profile_node: Nodo dentro de la jerarquía de arquitectura del producto.
  field_arch_type: Tipo de arquitectura
  label_cosmosys_arch_type_complex: Complejo
  label_cosmosys_arch_type_optical: Óptico
  label_cosmosys_arch_type_mechanical: Mecánico
  label_cosmosys_arch_type_hardware: Hardware
  label_cosmosys_arch_type_software: Software
  label_cosmosys_arch_dof: Grado de libertad
  text_cosmosys_arch_dof: Traslación o rotación rígida que controla un nodo de arquitectura.
  label_cosmosys_arch_cad_import: Importar arquitectura desde GLB
  label_cosmosys_arch_embedded_controls: Sin YAML — usar anotaciones del GLB
  label_cosmosys_arch_cad_model: Modelo CAD y controles
  text_cosmosys_arch_cad_import: Adjunta un GLB anotado o un GLB con su YAML y revisa la jerarquía. Si adjuntas ambos, sus controles deben coincidir. No se crea ningún ítem antes de confirmar.
  label_cosmosys_arch_review: Revisar importación
  label_cosmosys_arch_review_again: Repetir revisión
  label_cosmosys_arch_confirm: Confirmar importación
  label_cosmosys_arch_nodes: Nodos
  label_cosmosys_arch_dofs: Grados de libertad
  label_cosmosys_arch_import_mode: Política de importación
  label_cosmosys_arch_visible: Visible en el modelo
  label_cosmosys_arch_mode_include: Incluir
  label_cosmosys_arch_mode_atomic: Ensamblaje atómico
  label_cosmosys_arch_mode_exclude: Excluir subárbol
  text_cosmosys_arch_preflight: Excluir elimina el subárbol de la arquitectura. Los ensamblajes atómicos conservan la geometría pero no sus ítems internos. Despliega los que contengan controles necesarios. Los ítems invisibles siguen disponibles en informes. Repite la revisión si cambias decisiones.
  text_cosmosys_arch_pose_temporary: Los sliders sólo cambian este visor. No alteran el CAD original ni los valores predeterminados. Composición reposo, XYZ local y XYZ global, padres primero. PORIS y MQTT aún no están conectados.
  label_cosmosys_arch_controls_ready: Controles del modelo disponibles
  label_cosmosys_arch_reset_pose: Volver a los valores predeterminados
  label_cosmosys_arch_expand_all: Desplegar todo
  label_cosmosys_arch_collapse_all: Plegar todo
  label_cosmosys_arch_show_model: Ver modelo completo
  label_cosmosys_arch_show_context: Ver selección resaltada en contexto
  text_cosmosys_arch_tree_inspect: Pulsa el nombre para inspeccionar su subárbol; la flecha despliega sus hijos. El visor permite inspeccionar también lo excluido o invisible y no representa el filtro final. Plegar no cambia las decisiones.
  text_cosmosys_arch_repeat_review: Has cambiado decisiones. Pulsa «Repetir revisión» antes de confirmar la importación.
  field_arch_motion: Movimiento
  field_arch_axis: Eje
  field_arch_space: Sistema de coordenadas
  field_arch_min: Mínimo
  field_arch_max: Máximo
  field_arch_default: Predeterminado
  field_arch_step: Paso
